[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "btc-nq-cross-market-validation"
version = "1.0.0"
description = "Leakage-aware validation of BTC features for Nasdaq futures signals."
requires-python = ">=3.11"
dependencies = [
  "joblib>=1.4,<2",
  "matplotlib>=3.9,<4",
  "numpy>=2.0,<3",
  "pandas>=2.2,<3",
  "pandas-market-calendars>=4.4,<6",
  "PyYAML>=6.0,<7",
  "scikit-learn>=1.5,<2",
  "scipy>=1.13,<2",
]

[project.optional-dependencies]
dev = [
  "mypy>=1.11,<2",
  "nbformat>=5.10,<6",
  "pytest>=8.3,<9",
  "ruff>=0.6,<1",
]

[project.scripts]
cross-market-research = "cross_market.run:main"

[tool.setuptools.packages.find]
include = ["cross_market*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 110
target-version = "py311"
extend-exclude = ["archive", "legacy", "research", "src", "qc_trader"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
warn_unused_configs = true
check_untyped_defs = true
ignore_missing_imports = true
disable_error_code = ["import-untyped"]
exclude = ["legacy", "archive", "research"]

[[tool.mypy.overrides]]
# numpy.flatnonzero yields a platform-sized integer scalar; runtime conversion
# is lossless for positional frame indices, but NumPy's Linux stubs do not
# narrow it to builtins.int.
module = "cross_market.events"
disable_error_code = ["arg-type", "assignment"]
